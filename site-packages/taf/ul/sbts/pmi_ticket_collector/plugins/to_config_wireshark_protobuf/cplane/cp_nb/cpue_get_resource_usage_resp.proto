syntax = "proto3";
import "common_types/global_enb_id.proto";
package cp_nb_message;

message CpUeGetResourceUsageResp
{
    message MappedUeIdToSrbBearerPoolList
    {
        repeated uint32 srbPoolList = 1;
    }

    message CuUeAssociatedIds
    {
        oneof optional_globalEnbId
        {
            common_messages.GlobalEnbId globalEnbId = 1;
        };
        oneof optional_crnti
        {
            uint32 crnti = 2;
        };

        oneof optional_meNbUeX2ApId
        {
            uint32 meNbUeX2ApId = 3;
        };
        oneof optional_ueIdUp
        {
            uint32 ueIdUp = 4;
        };
        oneof optional_gNbDuId
        {
            uint32 gNbDuId = 5;
        };
        oneof optional_ueIdDu
        {
            uint32 ueIdDu = 6;
        };
        oneof optional_servedAmfId
        {
            uint32 servedAmfId = 7;
        };
        oneof optional_amfUeNgApId
        {
            uint64 amfUeNgApId = 8;
        };
    }

    message UeMappingTable
    {
        uint32 ueIdCu = 1;
        oneof optional_cuUeAssociatedIds
        {
            CuUeAssociatedIds cuUeAssociatedIds = 2;
        };
        oneof optional_mappedUeIdToSrbBearerPoolList
        {
            MappedUeIdToSrbBearerPoolList mappedUeIdToSrbBearerPoolList = 3;
        }
    }

    message UeMapping
    {
        repeated UeMappingTable ueMappingTable = 1;
    }

    uint32 cpUeAppId = 1;
    uint32 countUsedSrbIndex = 2;
    uint32 countFreeSrbIndex = 3;
    uint32 numberOfActiveUeSa = 4;
    uint32 numberOfActiveUeNsa = 5;
    oneof optional_ueMapping
    {
        UeMapping ueMapping = 6;
    }
}
