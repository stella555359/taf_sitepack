syntax = "proto3";
import "common_types/global_gnb_id.proto";
import "common/reported_Cell_List.proto";
import "common/gnb_configuration.proto";
import "common/cell_to_report_list_update.proto";

package cp_if_interface;

message CpCellInterGnbCaCellUpdateNotification
{
    uint32 transactionId = 1;
    common_messages.GlobalGnbId globalNgRanNodeId = 2;

    oneof optional_cellToReportListUpdate
    {
        common_messages.CellToReportListUpdate cellToReportListUpdate = 3;
    }

    oneof optional_reportedCellList
    {
        common_messages.ReportedCellList reportedCellList = 4;
    }

    oneof optional_interGNBCAAllowed
    {
        bool interGNBCAAllowed = 5;
    }

    oneof optional_gnbConfiguration
    {
        common_messages.GNBConfiguration gnbConfiguration = 6;
    }

    oneof optional_cellLoadReportingPeriodicity
    {
        uint32 cellLoadReportingPeriodicity = 7;
    }

    oneof optional_igNBCAXpProtocolVersion
    {
        uint32 igNBCAXpProtocolVersion = 8;
    }
}