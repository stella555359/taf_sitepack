syntax = "proto3";
import "options/protobuf_options.proto";
import "common_types/UeContextInformation.proto";
import "common/NrDcPSCellCandidate.proto";
import "common/nr_cell_identity.proto";

package cell_request;

message CpCellPSCellPreselectionReq
{
