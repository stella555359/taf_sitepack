syntax = "proto3";
import "common_types/global_enb_id.proto";
import "common_types/global_gnb_id.proto";
import "common_types/CpIfResourceReleaseReq_Cause.proto";
import "options/protobuf_options.proto";

package cp_if_interface;

message CpIfResourceReleaseReq
{
    oneof optional_cuUeId
    {
        uint32 cuUeId = 1 [ (cucpueid_param) = true ];
    }

    oneof optional_cause
    {
        ResourceRelease cause = 2;
    }

    oneof optional_gnbDuId
    {
        uint32 gnbDuId = 3;
    }

    oneof optional_duUeId
    {
        uint32 duUeId = 4;
    }

    oneof optional_menbUeX2ApId
    {
        uint32 menbUeX2ApId = 5;
    }

    oneof optional_meNBUeX2ApIdExtension
    {
        uint32 meNBUeX2ApIdExtension = 6;
    }

    oneof optional_globalEnbId
    {
        common_messages.GlobalEnbId globalEnbId = 7;
    }
    oneof optional_adjGnbUeXnApId
    {
        uint32 adjGnbUeXnApId = 8;
    }
    oneof optional_adjGlobalGnbId
    {
        common_messages.GlobalGnbId globalGnbId = 9;
    }
    oneof optional_amfUeNgapId
    {
        uint64 amfUeNgapId = 10;
    }
    oneof optional_servedAmfId
    {
        uint32 servedAmfId = 11;
    }
}
