syntax = "proto3";
import "common_types/global_enb_id.proto";
import "common_types/global_gnb_id.proto";
import "options/protobuf_options.proto";

package cp_f1ap_interface;

message SendToDu
{
    oneof optional_ueIdCu
    {
        uint32 ueIdCu = 1 [ (cucpueid_param) = true ];
    }
    uint64 gnbDuId = 2;
    bytes payload = 3;
    oneof optional_cpUeAddress
    {
        string cpUeAddress = 4;
    }

    oneof optional_menbUeX2ApId
    {
        uint32 menbUeX2ApId = 5;
    }

    oneof optional_meNBUeX2ApIdExtension
    {
        uint32 meNBUeX2ApIdExtension = 6;
    }

    oneof optional_globalEnbId
    {
        common_messages.GlobalEnbId globalEnbId = 7;
    }
    oneof optional_sourceGnbDuId
    {
        uint64 sourceGnbDuId = 8;
    }
    oneof optional_targetGnbDuId
    {
        uint64 targetGnbDuId = 9;
    }
    oneof optional_gnbDuUeF1APId
    {
        uint32 gnbDuUeF1APId = 10;
    }
    oneof optional_cpCellNodeAddress
    {
        string cpCellNodeAddress = 11;
    }
    oneof optional_procedureCode
    {
        uint32 procedureCode = 12;
    }
    oneof optional_newServingNrCellIdentity
    {
        uint64 newServingNrCellIdentity = 13;
    }
    oneof optional_isReestablishment
    {
        bool isReestablishment = 14;
    }
    oneof optional_adjGnbUeXnApId
    {
        uint32 adjGnbUeXnApId = 15;
    }
    oneof optional_adjGlobalGnbId
    {
        common_messages.GlobalGnbId adjGlobalGnbId = 16;
    }
}
