syntax = "proto3";
import "common_types/cplaneIpAddress.proto";

package cp_if_interface;

message CpIfTransportSoftwareConfigurationRequest
{
    uint32 transactionId = 1;
    common_type.CplaneIpAddressOfDualStack cpIfF1IpAddress = 5;

    repeated common_type.CplaneIpAddress cpIfX2IpAddressList = 2;
    repeated common_type.CplaneIpAddress cpIfUplaneX2IpAddressList = 3;
    repeated common_type.CplaneIpAddress cpIfUplaneXnIpAddressList = 4;

    repeated common_type.CplaneIpAddress cpIfXnIpAddressList = 6;
    repeated common_type.CplaneIpAddress cpIfNgIpAddressList = 7;
}
