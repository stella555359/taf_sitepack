syntax = "proto3";

package common_type;

message ImlbOffsets
{
    message EutraFreqOffset
    {
        uint32 earfcn = 1;
        int32 offset = 2;
    }

    message NrFreqOffset
    {
        uint32 nrarfcn = 1;
        int32 offset = 2;
    }

    message NrFreqOffsetList
    {
        repeated NrFreqOffset nrFreqOffset = 1;
    }

    message EutraFreqOffsetList
    {
        repeated EutraFreqOffset eutraFreqOffset = 1;
    }

    NrFreqOffsetList nrFreqList = 1;
    EutraFreqOffsetList eutraFreqList = 2;
}
