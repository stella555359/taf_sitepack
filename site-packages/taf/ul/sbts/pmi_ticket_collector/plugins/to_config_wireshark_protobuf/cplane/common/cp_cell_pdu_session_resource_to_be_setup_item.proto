syntax = "proto3";
package common_messages;

import "common/additional_qos_flow_information.proto";
import "common/snssai.proto";
import "common_types/allocationAndRetentionPriority.proto";

message PduSessionResourceToBeSetupItem
{
    message Nondynamic5QI
    {
        uint32 nonDynamic5QIDescriptor = 1;
    }

    message QoSFlowLevelQoSParameters
    {
        Nondynamic5QI qosCharacteristics = 1;
        AdditionalQoSFlowInformation additionalQoSFlowInformation = 2;
        common_type.AllocationAndRetentionPriority allocationAndRetentionPriority = 3;
        bool isGbr = 4;
    }

    message QoSFlowSetupRequestItem
    {
        uint32 qosFlowIdentifier = 1;
        QoSFlowLevelQoSParameters qosFlowLevelQoSParameters = 2;
    }
    uint32 pduSessionId = 1;
    common_messages.SNSSAI snssai = 2;
    repeated QoSFlowSetupRequestItem qosFlowSetupRequestList = 3;
    bool isEmergencySession = 4;
}
