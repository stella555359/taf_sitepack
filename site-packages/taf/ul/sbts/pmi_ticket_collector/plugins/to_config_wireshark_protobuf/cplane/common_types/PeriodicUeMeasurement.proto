syntax = "proto3";
import "common_types/ReportInterval.proto";

package common_type;

enum ReportAmount
{
    r2 = 0;
    r4 = 1;
    r8 = 2;
    r16 = 3;
    r32 = 4;
    r64 = 5;
    infinity = 6;
}

message PeriodicUeMeasurement
{
    ReportAmount reportAmount = 1;
    ReportInterval reportInterval = 2;
}
