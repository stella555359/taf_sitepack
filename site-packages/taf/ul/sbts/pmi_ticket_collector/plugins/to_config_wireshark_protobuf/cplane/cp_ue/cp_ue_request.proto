import "common/cpif_receive_from_du.proto";
import "cp_ue/cpue_data_distribution_request.proto";
import "cp_ue/receive_from_menb.proto";
import "common/cpif_f1_partial_reset_resp.proto";
import "cp_ue/cpue_load_measurement_setup_request.proto";
import "cp_ue/bearer_setup_resp.proto";
import "common/cpif_receive_from_core.proto";
import "cp_ue/cpif_receive_from_cuup.proto";
import "cp_ue/ul_sdu_receive_ind.proto";
import "cp_ue/srb_send_resp.proto";
