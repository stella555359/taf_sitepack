import "cp_ue/cpue_recv_initial_rrc_msg.proto";
import "cp_ue/cpcell_pdu_session_resource_resp.proto";
import "cp_ue/bearer_delete_resp.proto";
import "cp_ue/cpue_recv_nsa_initial_access_msg.proto";
import "cp_ue/short_mac_verification_resp.proto";
import "cp_ue/proceed_lock_step_resp.proto";
import "cp_ue/security_activation_resp.proto";
import "cp_ue/security_conf_resp.proto";
import "cp_ue/security_deactivation_resp.proto";
import "cp_ue/cpif_receive_from_gnb.proto";
import "cp_ue/cpue_deactivate_trace_req.proto";
import "cp_ue/cpcell_inter_gnb_target_check_resp.proto";
import "cp_ue/bearer_delete_list_resp.proto";
import "cp_ue/cpue_recv_cell_information.proto";
import "cp_ue/cpue_ng_link_info_update_ind.proto";
import "cp_ue/cpue_xn_link_info_update_ind.proto";
import "cp_ue/bearer_modify_resp.proto";
import "cp_ue/cpcell_scell_configuration_resp.proto";
import "common/overload_protection_ping.proto";
import "cp_ue/cpcell_ca_capability_check_resp.proto";
import "cp_ue/cpue_get_resource_usage_req.proto";
import "cp_ue/cpcell_pcmd_cookie_allocation_resp.proto";
import "options/protobuf_options.proto";
import "common/cpif_initial_nrdc.proto";
import "common/cpif_transfer_nrdc.proto";
import "cp_ue/cpcell_pscell_preselection_resp.proto";
import "cp_ue/cpcell_periodic_ue_meas_for_trace_resp.proto";

package cp_ue_request;

message CpUeRequest
{
    option (port_numbers) = 30500;
    oneof request
    {
        // CP-NB -> CP-UE
        CpUeNiddDeliveryRequest cpUeNiddDeliveryRequest = 2;
        CpUeDataDistributionRequest cpUeDataDistributionRequest = 4;
        CpUeLoadMeasSetupReq cpUeLoadMeasSetupReq = 106;
        CpUeGetResourceUsageReq cpUeGetResourceUsageReq = 161;

        // CP-IF -> CP-UE
        CpUeUeReleaseBulkReq cpue_ue_release_bulk_req = 103;
        CpIfResourceReleaseResp cpIfResourceReleaseResp = 22;
        common_messages.CpIfF1PartialResetResponse cpIfF1PartialResetResponse = 97;
        CpUeNgLinkInfoUpdateInd cpUeNgLinkInfoUpdateInd = 156;
        CpUeXnLinkInfoUpdateInd cpUeXnLinkInfoUpdateInd = 163;

        // CP-IF -> CP-UE - Forwards NgAp msg to CP-UE
        common_messages.CpIfReceiveFromCore cpIfReceiveFromCore = 111;

        // CP-IF -> CP-UE - Forwards X2Ap msg to CP-UE
        CpUeRecvNSAInitialAccessMsg cpUeRecvNSAInitialAccessMsg = 119;
        ReceiveFromMeNB receiveFromMeNB = 5;

        // CP-IF -> CP-UE - Forwards XnAp msg to CP-UE
        CpIfReceiveFromGnb cpIfReceiveFromGnb = 125;
        common_messages.CpIfInitialNrDc cpIfInitialNrDc = 164;
        common_messages.CpIfTransferNrDc cpIfTransferNrDc = 165;

        // CP-IF -> CP-UE - Forwards F1Ap msg to CP-UE
        CpUeRecvInitialRRCMsg cpUeRecvInitialRRCMsg = 116;
        common_messages.CpIfReceiveFromDu cpIfReceiveFromDu = 98;

        // CP-IF -> CP-UE - Forwards E1Ap msg to CP-UE
        CpIfReceiveFromCuUp cpIfReceiveFromCuUp = 120;

        // CP-CL -> CP_UE
        CpCellResourceReleaseResp cp_cell_resource_release_resp = 21;
        CpCellAdmissionResp cpCellAdmissionResp = 24;
        CpCellResourceModificationResp cp_cell_resource_modification_resp = 26;
        CpCellResourceReleaseListResp cp_cell_resource_release_list_resp = 113;
        CpCellRrcResourceResp cp_cell_rrc_resource_resp = 115;
        CpCellPduSessionResourceResp cp_cell_pdu_session_resource_resp = 117;
        CpUeDeactivateTraceReq cpUeDeactivateTraceReq = 150;
        CpCellInterGnbTargetCheckResp cpCellInterGnbTargetCheckResp = 151;
        CpUeRecvCellInformation cpUeRecvCellInformation = 155;
        CpCellSCellConfigurationResp cp_cell_scell_configuration_resp = 158;
        CpCellCaCapabilityCheckResp cp_cell_ca_capability_check_resp = 160;
        CpCellPcmdCookieAllocationResp cp_cell_pcmd_cookie_allocation_resp = 162;
        CpCellPSCellPreselectionResp cpCellPSCellPreselectionResp = 166;
        CpCellPeriodicUeMeasForTraceResp cpCellPeriodicUeMeasForTraceResp = 167;

        // CP-SB -> CP_UE
        BearerSetupResp bearerSetupResp = 110;
        BearerModifyResp bearerModifyResp = 157;
        BearerDeleteResp bearerDeleteResp = 118;
        BearerDeleteListResp bearerDeleteListResp = 152;
        ShortMacVerificationResp shortMacVerificationResp = 121;
        ProceedLockStepResp proceedLockStepResp = 122;
        SecurityActivationResp securityActivationResp = 123;
        SecurityConfResp securityConfResp = 124;
        SecurityDeactivationResp securityDeactivationResp = 154;
        SrbSendResp srbSendResp = 114;

        // CP-SB -> CP_UE - Forwards Nr-Rrc msg to CP-UE
        UlSduReceiveInd ulSduReceiveInd = 112;

        // CU Common
        common_messages.OverloadProtectionPing overloadProtectionPing = 159;
    }
}
