syntax = "proto3";

package common_type;

message CaOffsets
{
    message ScellWeightOffset
    {
        uint32 cellid = 1;
        int32 offset = 2;
    }
    message ScellWeightOffsetList
    {
        repeated ScellWeightOffset scellWeight = 1;
    }

    bool hasA1Offsets = 1;
    int32 a1rsrpOffset = 2;
    int32 a1rsrqOffset = 3;
    bool hasA2Offsets = 4;
    int32 a2rsrpOffset = 5;
    int32 a2rsrqOffset = 6;
    bool hasScellWeightOffsets = 7;
    ScellWeightOffsetList scellWeightList = 8;
}
