message CpCellNiddDeliveryRequest
{
    uint32 transactionId = 1;
    bytes masterPlmnIdentity = 2 [ (sensitive_param) = true ];

    enum CellTechnology
    {
        FDD = 0;
        TDD = 1;
    }

    enum ChBw
    {
        mhz5 = 0;
        mhz10 = 1;
        mhz15 = 2;
        mhz20 = 3;
        mhz30 = 4;
        mhz40 = 5;
        mhz50 = 6;
        mhz60 = 7;
        mhz70 = 8;
        mhz80 = 9;
        mhz90 = 10;
        mhz100 = 11;
    }

    message OptionalInteger
    {
        uint32 value = 1;
    }

    message Nsa
    {
        uint32 maxNumOfUsers = 1;
        uint32 maxNumOfNonGBRBearers = 2;
        uint32 addNumOfHoUsers = 3;
        uint32 addNumOfNonGBRBearersHo = 4;
        bool spCellChangeEnabled = 5;
    }

    message Sa
    {
        uint32 maxNumOfNonGBRBearersCGRPSA = 1;
        uint32 maxNumOfRrcCGRPSA = 2;
        uint32 addNumOfRrcCGRPSAHo = 3;
        uint32 addNumOfNonGBRBearersCGRPSAHo = 4;
    }

    message NrPlmnSetNSA
    {
        repeated uint32 nrPlmnIdList = 1;
    }

    message NrPlmnSetSA
    {
        repeated uint32 nrPlmnIdList = 1;
        uint32 trackingAreaId = 2;
    }

    message LteNrDssMbsfnRatio
    {
        uint32 minValue = 1;
        uint32 maxValue = 2;
    }

    message LteNrDssDlRatio
    {
        uint32 minNrDssRatio = 1;
        uint32 maxNrDssRatio = 2;
    }

    message NrDssLTE
    {
        oneof optional_lteNrDssMbsfnRatio
        {
            LteNrDssMbsfnRatio lteNrDssMbsfnRatio = 1;
        }
        oneof optional_lteNrDssDlRatio
        {
            LteNrDssDlRatio lteNrDssDlRatio = 2;
        }
    }

    message UeCaConnectionsLimits
    {
        OptionalInteger maxNumOf5To8CCUsers = 1;
        OptionalInteger maxNumOf3To4CCUsers = 2;
        OptionalInteger maxNumOf2CCUsers = 3;
    }

    message EmergencyCallRestrictions
    {
        bool emergencyCallMrListIgnore = 1;
        bool emergencyCallPlmnHoAllowed = 2;
    }

    message BwpProfile
    {
        uint32 cRbSizeDl = 1;
        uint32 cRbSizeUl = 2;
    }

    message NrCellData
    {
        uint64 nrCellIdentity = 1;
        uint32 physicalCellId = 2;
        uint32 nrArfcn = 3;
        CellTechnology cellTechnology = 4; // not specified in CP_2362, yet needed in CP_19995
        uint32 freqBandIndicatorNR = 5;
        oneof optional_chBw
        {
            ChBw chBw = 6;
        }
        uint32 maxNumOfUsersPerCell = 7;
        uint32 maxNumOfSCellAlloc = 8;
        uint32 maxNumOfNonGBRBearersSA = 9;
        uint32 maxNumOfRrcSA = 10;
        uint32 maxNumOfUsersNRCell = 11;
        uint32 nrCellId = 12;
        SystemInfoParameters systemInfoParameters = 13;
        uint32 ccLoadThreshold = 14;
        NrPlmnSetNSA nrPlmnSetNSA = 15;
        repeated NrPlmnSetSA nrPlmnSetSAList = 16;
        enum LteNrDssMode
        {
            none = 0;
            dssPhase1 = 1;
            dlCrsTdmUlFdm = 2;
            dssPhase3 = 3;
        }
        LteNrDssMode lteNrDssMode = 17;
        oneof optional_nrDssLTE
        {
            NrDssLTE nrDssLTE = 18;
        }
        repeated uint32 emergencyAreaIdList = 19;
        oneof optional_ueCaConnectionsLimits
        {
            UeCaConnectionsLimits ueCaConnectionsLimits = 20;
        }
        uint32 maxNumOfCaUsersNRCell = 21;
        uint32 numOfRadioResReservForEmergency = 22;
        uint32 maxNumOfGBRBearersSA = 23;
        uint32 addNumOfGBRBearers = 24;
        EmergencyCallRestrictions emergencyCallRestrictions = 25;
        bool actEmergencyCall = 26;
        oneof optional_arpPrioEmergencyCall
        {
            uint32 arpPrioEmergencyCall = 27;
        }
        CellDepType cellDepType = 29;
        repeated BwpProfile bwpList = 30;
        uint32 weightForSCellSelection = 31;
        bool acceptUnknownBcInCaTable = 32;
        bool acceptUnsupportedBcs = 33;
        bool actCaAwarePsCellSelectionFr1 = 34;
        oneof optional_maxNumSCellsDlFr1
        {
            uint32 maxNumSCellsDlFr1 = 35;
        }
        enum ActARPBasedAC
        {
            actArpBasedAcOff = 0;
            actArpBasedAcOn = 1;
            actArpBasedAcHandover = 2;
        }
        ActARPBasedAC actARPBasedAC = 36;
        bool actEnhMultipleDedicatedBWPs = 37;
        bool actNonVoNRGBRService = 38;
        oneof optional_numOfRadioResReservForTempUse
        {
            uint32 numOfRadioResReservForTempUse = 39;
        }
        oneof optional_allowEmergencyReservForTempUse
        {
            bool allowEmergencyReservForTempUse = 40;
        }
        oneof optional_preferNsaPreemption
        {
            bool preferNsaPreemption = 41;
        }
        ActNrDualConnectivity actNrDualConnectivity = 42;
        oneof optional_cellBwpList
        {
            common_messages.CellBwpList cellBwpList = 43;
        }
    }

    message NrCellGroupData
    {

        uint32 nrCellGroupId = 1;
        Nsa nsa = 2;
        Sa sa = 3;
        repeated NrCellData nrCellDataContainer = 4;
        Scs scs = 5;
    }

    message GnbDuData
    {
        uint64 gnbDuId = 1;
        uint64 nrDuId = 2;
        repeated NrCellGroupData nrCellGroupDataContainer = 3;
        bool actInterNumerologyCa = 4;
        repeated CarrierAggregationSupportList carrierAggregationSupportList = 5;
        uint32 numOfDrbsReservForEmergency = 6;
        enum FlexibleCAMode
        {
            BasicCAMode = 0;
            MixedCAMode = 1;
            ConfigurationIndependent = 2;
            NumberCellAmount = 3;
        }
        FlexibleCAMode flexibleCAMode = 7;
        enum CrntiAllocationOption
        {
            max72cells = 0;
            max144cells = 1;
        }
        CrntiAllocationOption crntiAllocationOption = 8;
        uint32 dlToUlContributionRatio = 9;
        common_type.ActInterGnbCa actInterGnbCa = 10;
    }

    repeated GnbDuData gnbDuDataContainer = 4;

    enum CaConfigurationSupport
    {
        None = 0;
        Support_2DL2UL = 1;
        Support_4DL2UL = 2;
        Support_8DL4UL = 3;
    }

    message CarrierAggregationSettings
    {
        bool actCarrierAggregation = 1;
        oneof optional_maxNumSCellsDl
        {
            uint32 maxNumSCellsDl = 2;
        }
        oneof optional_maxNumSCellsUl
        {
            uint32 maxNumSCellsUl = 3;
        }
        CaConfigurationSupport caConfigurationSupport = 4;
    }

    CarrierAggregationSettings carrierAggregationSettings = 5;

    enum DlBandwidth
    {
        prbs32 = 0;
        prbs64 = 1;
        prbs128 = 2;
        prbs256 = 3;
    }

    message SubCellGroup
    {
        DlBandwidth dlBandwidth = 1;
    }

    SubCellGroup subCellGroup = 6;

    uint32 timerf1NonUeProcGuard = 7;
    uint32 nsaCellActivationAlarmTimer = 8;
    enum F1SetupTimeToWait
    {
        v1s = 0;
        v2s = 1;
        v5s = 2;
        v10s = 3;
        v20s = 4;
        v60s = 5;
    }

    oneof optional_f1SetupTimeToWait
    {
        F1SetupTimeToWait f1SetupTimeToWait = 9;
    }

    GnbCuType gnbCuType = 10;

    uint32 nrBtsId = 11;
    uint32 x2partialresetcnftmr = 12;
    uint32 maxX2EnDcCfUpRetry = 13;
    uint32 x2EnDcCfUpRdmDelayTmr = 14;
    uint32 x2EnDcCfUpNbInfoBackOffTmr = 15;
    uint32 x2EnDcCfUpRspTmr = 16;

    message NrCellBlockHoTimer
    {
        uint64 nrCellIdentity = 1;
        oneof optional_blockHoTimer
        {
            uint32 blockHoTimer = 2;
        }
    }

    repeated NrCellBlockHoTimer nrCellBlockHoTimerContainer = 17;

    bool actRanSharing = 18;

    message NrPLMN
    {
        uint32 nrPlmnId = 1;
        bytes plmnIdentity = 2 [ (sensitive_param) = true ];
    }

    repeated NrPLMN nrPlmnContainer = 19;

    uint32 saCellActivationAlarmTimer = 20;
    uint32 gnbIdLength = 21;
    bool actCMAS = 22;
    bool actTrsSepaNSARanSharing = 23;
    bool actETWS = 25;

    message TrackingArea
    {
        uint32 fiveGsTac = 1;
        uint32 trackingAreaId = 2;
    }

    repeated TrackingArea trackingAreaList = 26;
    oneof optional_maxX2CellListSize
    {
        uint32 maxX2CellListSize = 27;
    }
    message AnrConfiguration
    {
        uint32 consecHoFailThreshold = 1;

        message NrAnrProfile
        {
            oneof optional_ssbFrequency
            {
                uint32 ssbFrequency = 1;
            }
            uint32 idleTimeForNrNbRemoval = 2;
            uint32 maxNumAnrNrrelAllowed = 3;
            uint32 consecRecheckForNrNbRemoval = 4;

            enum CellDepMode
            {
                NSA = 0;
                SA = 1;
                both = 2;
                automatic = 3;
                saPlusNsa = 4;
            }
            CellDepMode cellDepMode = 5;
            oneof optional_nrarfcn
            {
                uint32 nrarfcn = 6;
            }
        }
        message NrAnrProfileE
        {
            oneof optional_carrierFrequency
            {
                uint32 carrierFrequency = 1;
            }
            uint32 idleTimeForEutraNbRemoval = 2;
            uint32 maxNumAnrNrrelPerCell = 3;
            uint32 consecRecheckForEutraNbRemoval = 4;
        }
        repeated NrAnrProfile nrAnrProfiles = 2;
        oneof optional_defaultAnrProfile
        {
            NrAnrProfile defaultAnrProfile = 3;
        }
        bool actAutoNrNbRemoval = 4;
        bool actNsaUeBasedAnrNr = 5;
        bool actSaUeBasedAnrNr = 6;
        bool actNsaUeBasedInterFreqAnrNr = 7;
        bool actEnhanceIntraNrIntraFreqAnr = 8;
        bool actSaUeBasedAnrEutra = 9;
        repeated NrAnrProfileE nrAnrProfileEs = 10;
        oneof optional_defaultAnrProfileE
        {
            NrAnrProfileE defaultAnrProfileE = 11;
        }
        bool actAutoEutraNbRemoval = 12;
        uint32 consecHoFailThresEutra = 13;
        uint32 maxNumNrAnrMoiAllowed = 14;
