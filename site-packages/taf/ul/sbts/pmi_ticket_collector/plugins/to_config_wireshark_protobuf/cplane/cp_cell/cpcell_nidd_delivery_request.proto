        OptionalInteger numberOfTransmittedSsBlocks = 3;
        Smtc smtc = 4;
        int32 qRxLevMin = 5;
        uint32 tReselectionNr = 6;
        uint32 threshXHighP = 7;
        uint32 threshXLowP = 8;
        QOffsetRange qOffsetFrequency = 9;
        repeated NeighCellInfo neighCellList = 10;
        repeated BlackListInfo blackListInfo = 11;
        OptionalThreshXQ threshXQ = 12;
        OptionalInteger cellReselectionPriority = 13;
        OptionalCellReselectionSubPriority cellReselectionSubPriority = 14;
        OptionalSInteger qQualMin = 15;
        OptionalSInteger pMax = 16;
        OptionalTReselectionNRSF tReselectionNrSf = 17;
        OptionalInteger numberOfSSBlocksToAverage = 18;
        AbsThreshSsbConsolidation absThreshSsbConsolidation = 19;
        uint32 freqBandIndicatorNR = 20;
        OptionalMultifreqBandIndicatorNR multiFreqBandIndicatorNR = 21;
        repeated OptionalNrMultibandInfoList nrMultibandInfoList = 22;
        bool interFreqCarrierFreqIsDSS = 23;
