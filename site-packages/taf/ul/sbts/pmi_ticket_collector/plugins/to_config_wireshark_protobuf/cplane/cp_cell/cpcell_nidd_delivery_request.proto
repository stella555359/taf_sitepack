    OptionalInteger threshServingLowQ = 15;
    uint32 cellReselectionPriority = 16;
    uint32 tReselectionEutra = 17;
    OptionalSfMediumEutra sfMediumEutra = 18;
    OptionalSfHighEutra sfHighEutra = 19;
    OptionalCellReselectionSubPriority cellReselectionSubPriority = 20;
    IntraFreqIdleModeParams intraFreqIdleModeParams = 22;
    repeated NeighCarrierInfo interFreqIdleModeParams = 23;
    EutraIdleModeParams eutraIdleModeParameters = 24;
    repeated SibSchedulingListItem sibSchedulingList = 25;
    bool skipSsbToMeasInSib = 26;
