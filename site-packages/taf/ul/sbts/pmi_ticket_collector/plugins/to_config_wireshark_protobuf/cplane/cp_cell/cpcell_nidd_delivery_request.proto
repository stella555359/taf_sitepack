    message OptionalSfHighEutra
    {
        SfHighEutra value = 1;
    }

    message ThreshXQ
    {
        uint32 highQ = 1;
        uint32 lowQ = 2;
    }

    message OptionalThreshXQ
    {
        ThreshXQ value = 1;
    }

    message Smtc
    {
        enum Periodicity
        {
            sf5 = 0;
            sf10 = 1;
            sf20 = 2;
            sf40 = 3;
            sf80 = 4;
            sf160 = 5;
        }

        enum Duration
        {
            sf_1 = 0;
            sf_2 = 1;
            sf_3 = 2;
            sf_4 = 3;
            sf_5 = 4;
        }

        Periodicity periodicity = 1;
        uint32 offset = 2;
        Duration duration = 3;
    }

    message OptionalMultifreqBandIndicatorNR
    {
        repeated uint32 value = 1;
    }

    message OptionalFreqBandIndicatorNR
    {
        uint32 value = 1;
    }

    message OptionalNrBandPriority
    {
        uint32 value = 1;
    }

    message OptionalNrNsPmaxList
    {
        message NrNsPmaxValue
