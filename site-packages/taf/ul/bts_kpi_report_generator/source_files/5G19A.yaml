    \ sends a DDDS to CU.      - The timer stops when the DDDS (sent by the MAC PDU)\
    \ message is received by CU over F1 to acknowledge the packet ((removed from CU\
    \ buffer).Note: -\tThe formula is working for both Nokia and 3GPP flow control.\
    \ -\tWe can consider that the time to process the DDDS message is equivalent to\
    \ a PDU message received on CU over F1 and the PDU was sent by MAC PDU."
