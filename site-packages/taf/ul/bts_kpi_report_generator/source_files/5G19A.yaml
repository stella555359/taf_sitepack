NR_5073a:
  ABBREVIATION: IntergNB PSC chng exec SR tgNB
  CATEGORY:
  - Mobility
  DEPENDENCIES:
    M55112C02504: Number of incoming SGNB ADDITION REQUEST ACKNOWLEDGE sent LTE eNB
      upon SN change trigger
    M55112C02506: Number of incoming and successful SGNB RECONFIGURATION COMPLETE
      recvd from LTE eNB upon SN chg trig
  DESCRIPTION: 'This KPI shows the inter gNB intra frequency PSCell change execution
    success ratio calculated on the target gNB. The execution is considered successful
    when target gNB receives the X2AP: SGNB RECONFIGURATION COMPLETE sent by LTE eNB
    (with Configuration successfully applied IE) upon SN Change trigger. The execution
    attempts are given by the number of  X2AP: SGNB ADDITION REQUEST ACKNOWLEDGE sent
    to LTE eNB, upon SN Change trigger.'
  FORMULA: 100 * Sum([M55112C02506])/Sum([M55112C02504])
  LOGICAL_FORMULA: IntergNB PSC chng exec SR tgNB = 100 * IntergNB PSC chng exec succ
    / IntergNB PSC chng exec att
