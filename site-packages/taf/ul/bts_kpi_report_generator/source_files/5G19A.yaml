    the MAX harq retransmission reached and the number of packets to transmit, that
    is, the 1st HARQ transmissions.In real-time monitoring, the HARQ feedback might
    be received in a diferent measurement period than the initial transmission. For
    that reason, the initial transmissions in the formula are calculated as the successful
    transmissions plus the unsuccessful transmissions.HARQ feedback DTX is considered
    as unsuccessful.
