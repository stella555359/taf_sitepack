NR_5020b:
  ABBREVIATION: NSA call access
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55112C00002: ''
    M55112C00006: ''
    M55112C00010: ''
  DESCRIPTION: This KPI shows the Non Stand Alone call accessiblity on 5G prespective.
    The formula monitors the call setup procedure until the X2AP SN Status Transfer
    is received by SgNB. The remaining steps on NSA call setup are on LTE side an
    are not monitored by this formula.
  ERRORS:
  - 'No dependencies found : M55112C00002, M55112C00006, M55112C00010    (Formula
    has counters which are not dependent due to lack of occurrence in its KPI dependencies)'
  FORMULA: (100 * Sum([M55112C00006]) / Sum([M55112C00002] + [M55112C00010]))
  LOGICAL_FORMULA: None
  NAME: 5G Non Stand Alone call accessibility, 5G side
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55112C00006])/SUM([M55112C00002]+[M55112C00010]))
NR_5020c:
  ABBREVIATION: NSA call access
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55112C00002: Number of outgoing SGNB ADDITION REQUEST ACKNOWLEDGE sent to LTE
      eNB) for call setup
    M55112C00004: Number of incoming and successful SGNB RECONFIGURATION COMPLETE
      received from LTE eNB for call setup
    M55112C00010: Number of outgoing SGNB ADDITION REQUEST REJECT sent to LTE eNB
      for call setup
  DESCRIPTION: This KPI shows the Non Stand Alone call accessiblity on 5G prespective.
    The formula monitors the call setup procedure until the SGNB RECONFIGURATION COMPLETE
    is received by SgNB fromLTE eNB (with Configuration successfully applied IE) for
    initial NSA call setup . The remaining steps on NSA call setup are on LTE side
    an are not monitored by this formula.
  FORMULA: 100 * Sum([M55112C00004])/ Sum([M55112C00002] + [M55112C00010])
  LOGICAL_FORMULA: NSA call access = 100* (Number of successful SgNB Reconfiguration
    Completion for initial NSA call setup)/(Number of attempted SgNB Addition Preparation
    procedures) for initial NSA call setup
  NAME: 5G Non Stand Alone call accessibility, 5G side
  UNIT: '%'
  XLSX_FORMULA: 100*SUM([M55112C00004])/SUM([M55112C00002]+[M55112C00010])
NR_5030a:
  ABBREVIATION: Tot SgNB norm rel R
  CATEGORY:
  - Retainability
  DEPENDENCIES:
    M55110C00020: number of UE release due to outgoing X2 Reset
    M55110C00028: Number of UE release due to outgoing X2 Partial Reset
    M55112C00007: Number of outgoing SGNB RELEASE REQUIRED sent to LTE eNB
    M55112C02001: Number of SGNB RELEASE REQUIRED message sent with cause equal to
      User inactivity
  DESCRIPTION: This KPI shows the NSA call retainability for SgNB initiated releases.
    The normal releases are considered those initiated due to user inactivity, while
    the total number of releases are the SgNB initiated releases and the releases
    caused X2 Reset. Releases initiated by the LTE MeNB are not considered in this
    KPI.
  FORMULA: (100 * Sum([M55112C02001])/Sum([M55112C00007]+ [M55110C00020]+ [M55110C00028]))
  LOGICAL_FORMULA: None
  NAME: 5G SgNB triggered normal release ratio
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55112C02001])/SUM([M55112C00007]+[M55110C00020]+[M55110C00028]))
