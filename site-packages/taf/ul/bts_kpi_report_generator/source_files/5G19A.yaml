  DESCRIPTION: "This KPI shows the average estimated F1 round trip delay between CU\
    \ and MAC DU, measured on gNB and per DU.- The timer is started when the PDCP\
    \ PDU packet is sent by CU over F1 (PDCP PDU packet has left CU)- Then, this PDCP\
