    gNB
  UNIT: '%'
  XLSX_FORMULA: 100*SUM([M55112C02506])/SUM([M55112C02504])
NR_5074a:
  ABBREVIATION: IntergNB PSC chng tot SR tgNB
  CATEGORY:
  - Mobility
  DEPENDENCIES:
    M55112C02503: Number of incoming SGNB ADDITION REQUEST received from LTE eNB upon
      SN change trigger
    M55112C02506: Number of incoming and successful SGNB RECONFIGURATION COMPLETE
      recvd from LTE eNB upon SN chg trig
  DESCRIPTION: 'This KPI shows the inter gNB intra frequency PSCell change total success
    ratio calculated in the target gNB. The total success ratio is calculated from
    the successful execution over the preparation attempts. The preparation attempts
    are the number of X2AP: SGNB ADDITION REQUEST messages received from LTE eNB upon
    SN Change trigger. The execution successes are given by the number of X2AP: SGNB
    RECONFIGURATION COMPLETE messages (with Configuration successfully applied IE)
    sent by LTE eNB to the target gNB, upon SN Change trigger.'
  FORMULA: 100 * Sum([M55112C02506])/Sum([M55112C02503])
  LOGICAL_FORMULA: IntergNB PSC chng tot SR tgNB = 100 * IntergNB PSC chng exec succ
    / IntergNB PSC chng prep att
  NAME: 5G Inter gNB intra frequency PSCell change total success ratio on target gNB
  UNIT: '%'
  XLSX_FORMULA: 100*SUM([M55112C02506])/SUM([M55112C02503])
