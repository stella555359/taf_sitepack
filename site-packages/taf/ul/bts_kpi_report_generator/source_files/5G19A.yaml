NR_5000a:
  ABBREVIATION: In X2 stp req rx LTE eNB
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55110C00003: Number of incoming EN-DC X2 SETUP request received from LTE eNB
  DESCRIPTION: This KPI shows the number of incoming X2 setup requests received in
    gNB from LTE eNB for EUTRAN NewRadio dual connectivity (EN-DC).
  FORMULA: (Sum([M55110C00003]))
  LOGICAL_FORMULA: None
  NAME: 5G Number of incoming X2 setup request received from LTE eNB
  UNIT: '#'
  XLSX_FORMULA: (SUM([M55110C00003]))
NR_5001a:
  ABBREVIATION: X2 stp proc SR
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55110C00003: Number of incoming EN-DC X2 SETUP request received from LTE eNB
    M55110C00004: Number of successful EN-DC X2 SETUP procedure (number of EN-DC X2
      SETUP response sent to LTE eNB)
  DESCRIPTION: This KPI shows the success ratio of the X2 setup procedure on the gNB
    for EUTRAN NewRadio dual connectivity (EN-DC). The message  EN-DC X2 SETUP RESPONSE
    is sent in case of successful operation.
  FORMULA: (100 * Sum([M55110C00004]) / Sum([M55110C00003]))
  LOGICAL_FORMULA: None
  NAME: 5G X2 setup procedure success ratio
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55110C00004])/SUM([M55110C00003]))
NR_5003b:
  ABBREVIATION: Nr SgNB add req
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55112C00002: Number of outgoing SGNB ADDITION REQUEST ACKNOWLEDGE sent to LTE
      eNB) for call setup
    M55112C00010: Number of outgoing SGNB ADDITION REQUEST REJECT sent to LTE eNB
      for call setup
  DESCRIPTION: This KPI shows the number of incoming SGNB addition requests received
    from LTE eNB.
  FORMULA: Sum([M55112C00002] + [M55112C00010])
  LOGICAL_FORMULA: None
  NAME: 5G Number of SgNB addition requests
  UNIT: '#'
  XLSX_FORMULA: SUM([M55112C00002]+[M55112C00010])
NR_5004b:
  ABBREVIATION: SgNB add prep SR
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55112C00002: Number of outgoing SGNB ADDITION REQUEST ACKNOWLEDGE sent to LTE
      eNB) for call setup
    M55112C00010: Number of outgoing SGNB ADDITION REQUEST REJECT sent to LTE eNB
      for call setup
  DESCRIPTION: This KPI shows the success ratio of the SGNB addition preparation procedure.
  FORMULA: (100 * Sum([M55112C00002]) / Sum([M55112C00002] + [M55112C00010]))
  LOGICAL_FORMULA: None
  NAME: 5G SgNB addition preparation success ratio
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55112C00002])/SUM([M55112C00002]+[M55112C00010]))
NR_5005a:
  ABBREVIATION: SgNB reconfig SR
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55112C00003: Number of incoming SGNB RECONFIGURATION COMPLETE received from LTE
      eNB for call setup
    M55112C00004: Number of incoming and successful SGNB RECONFIGURATION COMPLETE
      received from LTE eNB for call setup
    M55112C00012: Number of not received SGNB RECONFIGURATION COMPLETE from LTE eNB
      on time for call setup
  DESCRIPTION: This KPI shows the success ratio of the SgNB reconfiguration procedure.
    The denominator includes the the cases when the X2AP SgNB Reconfiguration Complete
    message is not received until TDCoverall timer expiry.
  FORMULA: (100*Sum([M55112C00004])/Sum([M55112C00003] + [M55112C00012]))
  LOGICAL_FORMULA: None
  NAME: 5G SgNB reconfiguration success ratio
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55112C00004])/SUM([M55112C00003]+[M55112C00012]))
NR_5006a:
  ABBREVIATION: Stat transf FR dur SgNB add
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55112C00006: Number of incoming SN STATUS TRANSFER received from LTE eNB
    M55112C00013: Number of not received SN STATUS TRANSFER from LTE eNB on time
  DESCRIPTION: This KPI shows the ratio of not received SN Status Transfer messages
    in time, during SgNB addition.
  FORMULA: (100 * Sum([M55112C00013]) / Sum([M55112C00006] + [M55112C00013]))
  LOGICAL_FORMULA: None
  NAME: 5G Status Transfer failure ratio during SgNB Addition
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55112C00013])/SUM([M55112C00006]+[M55112C00013]))
NR_5009a:
  ABBREVIATION: UE ctx stp SR
  CATEGORY:
  - Accessibility
  DEPENDENCIES:
    M55113C01001: Number of Ue Context Setup Requests sent
    M55113C01002: Number of Ue Context Setup Response received
  DESCRIPTION: This KPI shows the success ratio of the UE context setup procedure
    performed by the gNB-DU and then communicated to the gNB-CU. The KPI is updated
    per NRCell.
  FORMULA: (100 * Sum([M55113C01002]) / Sum([M55113C01001]))
  LOGICAL_FORMULA: None
  NAME: 5G UE context setup success ratio
  UNIT: '%'
  XLSX_FORMULA: (100*SUM([M55113C01002])/SUM([M55113C01001]))
