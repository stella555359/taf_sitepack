  CATEGORY:
  - Mobility
  DEPENDENCIES:
    M55112C02503: Number of incoming SGNB ADDITION REQUEST received from LTE eNB upon
      SN change trigger
  DESCRIPTION: 'This KPI shows the inter gNB intra frequency PSCell change preparation
    attempts measured in the target gNB. The preparation attempts are the number of
    X2AP: SGNB ADDITION REQUEST messages received from LTE eNB upon SN Change trigger.'
  FORMULA: Sum([M55112C02503])
  LOGICAL_FORMULA: IntergNB PSC chng prep SR tgNB = 100 * IntergNB PSC chng prep succ
    / IntergNB PSC chng prep att
  NAME: 5G Inter gNB intra frequency PSCell change preparation attempt on target gNB
  UNIT: '%'
  XLSX_FORMULA: SUM([M55112C02503])
NR_5071a:
  ABBREVIATION: IntergNB PSC chng prep SR tgNB
  CATEGORY:
  - Mobility
  DEPENDENCIES:
    M55112C02503: Number of incoming SGNB ADDITION REQUEST received from LTE eNB upon
      SN change trigger
    M55112C02504: Number of incoming SGNB ADDITION REQUEST ACKNOWLEDGE sent LTE eNB
      upon SN change trigger
  DESCRIPTION: 'This KPI shows the inter gNB intra frequency PSCell change preparation
    sussess ratio measured in the target gNB. The preparation attempts are the number
    of X2AP: SGNB ADDITION REQUEST messages received from LTE eNB upon SN Change trigger.
    The successful preparations are given by the number of X2AP: SGNB ADDITION ACKNOWLEDGE
    sent by target gNB to LTE eNB, upon SN Change trigger.'
  FORMULA: 100 * Sum([M55112C02504])/Sum([M55112C02503])
  LOGICAL_FORMULA: IntergNB PSC chng prep att tgNB = Number of SGNB ADDITION REQUEST
    received from LTE eNB upon SN Change trigger
  NAME: 5G Inter gNB intra frequency PSCell change preparation success ratio on target
    gNB
  UNIT: '#'
  XLSX_FORMULA: 100*SUM([M55112C02504])/SUM([M55112C02503])
NR_5072a:
  ABBREVIATION: IntergNB PSC chng exec att tgNB
  CATEGORY:
