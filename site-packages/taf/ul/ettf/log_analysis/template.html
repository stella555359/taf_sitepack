<html>
  <style>
    .details-common {
      font-family: sans-serif, Helvetica, Arial;
    }
    .summary-title {
      cursor: pointer;
      background-color: lightgray;
      padding: 10px;
      border: 2px;
      border-style: solid;
      border-color: lightgray;
      border-radius: 6px 6px 6px 6px;
      list-style: none;
    }
    .summary-title:hover {
      background-color: snow;
      border-color: slategrey;
    }
    .expansion {
      background-color: whitesmoke;
      padding: 10px;
      border-radius: 6px 6px 6px 6px;
    }
    .line {
      margin: 3px;
      padding: 0px;
      border: 1px;
      border-color: lightgray;
      border-bottom-style: solid;
    }
    .line:hover {
      background-color: azure;
    }
  </style>
  <div>
    {%- for result in results -%}
    <details class="details-common">
      <summary class="summary-title">
        {{ result.trigger }} analysis: {{ result.analyzed_path }}
      </summary>
      <div class="expansion">
        {%- for lines in result.data.values() -%}{%- for line in
        lines[:max_lines] -%}
        <p class="line">{{ line }}</p>
        {%- endfor -%}{%- endfor -%}
      </div>
    </details>
    {%- endfor -%}
  </div>
</html>
